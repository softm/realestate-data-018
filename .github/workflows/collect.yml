name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints and incomplete pages within existing request budgets'
  schedule:
    - cron: '9-59/10 * * * *'
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
jobs:
  regional:
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@8bec3b1e87e173db0e9e2f6d989e284db93276a1
    with:
      engine_ref: 4e8f3f8daefa1018a5a0c0389cc0d8bac0c20bb7
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

